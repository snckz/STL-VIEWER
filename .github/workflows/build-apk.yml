name: APK bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Feste Version: ubuntu-24.04 hat das Android-SDK vorinstalliert (ubuntu-latest wechselt gerade auf 26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android-SDK prüfen
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Viewer in die App kopieren
        run: node web/build.mjs android/app/src/main/assets/index.html --offline

      - name: Signaturschlüssel aus den Secrets holen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 und KEYSTORE_PASSWORD fehlen. Anleitung: README, Abschnitt 'Selbst bauen'."
            exit 1
          fi
          # Leerzeichen und Zeilenumbrüche entfernen, die beim Kopieren (z. B. am Handy) mitkommen können
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/release.keystore || {
            echo "::error::KEYSTORE_BASE64 ist kein gültiger Base64-Text – bitte den Wert noch einmal vollständig kopieren."; exit 1; }
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "::notice::Schlüsseldatei: $(wc -c < android/app/release.keystore) Bytes, Prüfsumme $(sha256sum android/app/release.keystore | cut -c1-16) (erwartet 2b6c95e00aad4fc3), Passwortlänge ${#PW} (erwartet 32)"
          keytool -list -keystore android/app/release.keystore -storepass "$PW" -alias modellblick > /dev/null || {
            echo "::error::Passwort und Schlüssel passen nicht zusammen. Prüfe die Secrets KEYSTORE_PASSWORD und KEYSTORE_BASE64."; exit 1; }

      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../gradle.log || {
            # Die wichtigsten Fehlerzeilen als Annotation ausgeben, damit sie ohne Anmeldung sichtbar sind
            MSG=$(grep -E -A12 "What went wrong|error:|ERROR:|AAPT|FAILED|Execution failed" ../gradle.log | head -n 60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle-Build fehlgeschlagen::$MSG"
            exit 1
          }

      - name: Signatur prüfen
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Schlüsseldatei entfernen
        if: always()
        run: rm -f android/app/release.keystore

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Modellblick-${{ github.run_number }}.apk

      - name: Als Download speichern (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Modellblick-APK
          path: Modellblick-${{ github.run_number }}.apk

      - name: Release mit APK veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Modellblick 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Installieren:** `Modellblick-${{ github.run_number }}.apk` am Android-Handy herunterladen und öffnen. Beim ersten Mal fragt Android, ob der Browser Apps installieren darf – erlauben.
            Ältere Versionen werden dabei automatisch aktualisiert. Voraussetzung: Android 8.0 oder neuer.
          files: Modellblick-${{ github.run_number }}.apk
