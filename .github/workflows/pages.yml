name: Web-App veröffentlichen

# Baut die installierbare Web-App (für iPhone/iPad: Safari → Teilen → „Zum Home-Bildschirm“)
# und veröffentlicht sie über GitHub Pages.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Web-App bauen
        run: node web/build.mjs --pwa site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
