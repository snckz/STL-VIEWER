name: Web-App veröffentlichen

# Baut die installierbare Web-App (für iPhone/iPad: Safari → Teilen → „Zum Home-Bildschirm“)
# und legt sie im Zweig gh-pages ab. GitHub Pages veröffentlicht diesen Zweig automatisch.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Web-App bauen
        run: node web/build.mjs --pwa site

      - name: In den Zweig gh-pages übertragen
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web-App aus ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
